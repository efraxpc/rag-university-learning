# Permite a la API crear/listar Jobs de chunking en el namespace (patrón
# del tutorial oficial: endpoint.py crea batch/v1 Jobs vía la API de K8s).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: rag
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-manager-binding
  namespace: rag
subjects:
  - kind: ServiceAccount
    name: ksa-api
    namespace: rag
roleRef:
  kind: Role
  name: job-manager
  apiGroup: rbac.authorization.k8s.io
